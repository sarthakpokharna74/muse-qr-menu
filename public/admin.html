<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muse admin</title>
  <link rel="icon" type="image/webp" href="/logo-96.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/index-ChRsq97C.css" />
  <style>
    /* 1. High-Priority Floating Table Alert Banners (Waiter & Bill Requests) */
    #adminAlertsBannerHost {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 92%;
      max-width: 580px;
      pointer-events: none;
    }
    .admin-table-alert {
      pointer-events: auto;
      color: #fff;
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 0 1.5px rgba(255,255,255,0.15);
      animation: alertPopIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .admin-table-alert.type-waiter {
      border-left: 6px solid #f59e0b;
      background: linear-gradient(135deg, #2e1d10 0%, #1f150e 100%);
    }
    .admin-table-alert.type-bill {
      border-left: 6px solid #3b82f6;
      background: linear-gradient(135deg, #10233f 0%, #0d1729 100%);
    }
    .admin-table-alert .alert-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .admin-table-alert .alert-emoji {
      font-size: 1.9rem;
      animation: alertRing 1.5s ease infinite;
    }
    .admin-table-alert .alert-title {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .admin-table-alert .alert-sub {
      font-size: 0.82rem;
      opacity: 0.85;
      margin-top: 2px;
    }
    .admin-table-alert .alert-ack-btn {
      background: #fff;
      color: #1c1511;
      border: none;
      border-radius: 9px;
      padding: 8px 15px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.1s, background 0.15s;
    }
    .admin-table-alert .alert-ack-btn:hover {
      background: #f7eee4;
      transform: scale(1.03);
    }
    @keyframes alertPopIn {
      from { opacity: 0; transform: translateY(-16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes alertRing {
      0%, 100% { transform: rotate(0); }
      10%, 30% { transform: rotate(-15deg); }
      20%, 40% { transform: rotate(15deg); }
      50% { transform: rotate(0); }
    }

    </style>
</head>
<body>
  <div id="root"></div>

  <!-- Floating Waiter & Bill Alerts Container -->
  <div id="adminAlertsBannerHost"></div>

  <!-- Floating Shortcut Dock: Kitchen Display + Notification Sound Manager -->
  <div style="position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
    <a href="/kitchen" target="_blank" id="adminKitchenShortcut" style="background: #0f172a; color: #f8fafc; border: 1.5px solid #334155; padding: 10px 18px; border-radius: 50px; font-weight: 700; font-size: 0.88rem; text-decoration: none; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.35); transition: transform 0.15s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      <span>👨‍🍳</span> Kitchen Display (Chef Panel) ↗
    </a>
    <button type="button" id="adminSoundShortcut" onclick="window.openSoundSettingsModal()" style="background: #451a03; color: #fef3c7; border: 1.5px solid #92400e; padding: 10px 18px; border-radius: 50px; font-weight: 700; font-size: 0.88rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.35); cursor: pointer; transition: transform 0.15s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
      <span>🔔</span> Alert Sound & Chime
    </button>
  </div>

  <script type="module" src="/assets/index-DEbz15yT.js"></script>

  <!-- UNIFIED AUDIO & REAL-TIME ALERTS ENGINE -->
  <script>
    (function () {
      let audioCtx = null;
      let lastAlertTime = 0;
      let knownCallIds = new Set();
      let lastReminderTime = 0;
      let lastPulseRev = null;

      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      // Sync sound settings from server if not set
      async function syncSoundSettings() {
        try {
          const res = await fetch('/api/admin/settings');
          if (res.ok) {
            const data = await res.json();
            if (data.sound_type && !localStorage.getItem('muse_sound_type')) {
              localStorage.setItem('muse_sound_type', data.sound_type);
            }
            if (data.sound_name && !localStorage.getItem('muse_sound_name')) {
              localStorage.setItem('muse_sound_name', data.sound_name);
            }
            if (data.sound_volume !== undefined && !localStorage.getItem('muse_sound_volume')) {
              localStorage.setItem('muse_sound_volume', String(data.sound_volume));
            }
          }
        } catch {}
      }
      syncSoundSettings();

      // Universal Alert Sound Player (Plays Owner's Chosen Custom File or Preset)
      window.playAlertSound = function (type = 'order') {
        const now = Date.now();
        // Debounce within 1200ms to avoid duplicate chimes
        if (now - lastAlertTime < 1200) return;
        lastAlertTime = now;

        const soundType = localStorage.getItem('muse_sound_type') || 'bell';
        const soundVol = parseFloat(localStorage.getItem('muse_sound_volume') || '1.0');
        const customData = localStorage.getItem('muse_custom_sound');

        // 1. Custom Device Sound
        if (soundType === 'custom') {
          const soundSrc = customData || '/custom-sound.audio?t=' + Date.now();
          try {
            const audio = new Audio(soundSrc);
            audio.volume = Math.max(0.1, Math.min(1.0, soundVol));
            const playPromise = audio.play();
            if (playPromise !== undefined) {
              playPromise.catch(e => {
                console.warn('Custom audio playback blocked/failed, using brass bell fallback:', e);
                synthesizeBell(type, soundVol);
              });
            }
            return;
          } catch (e) {
            console.warn('Error loading custom audio, using brass bell fallback:', e);
          }
        }

        // 2. Synthesized presets using Web Audio API
        if (soundType === 'chime') {
          synthesizeChime(soundVol);
        } else if (soundType === 'beep') {
          synthesizeBeep(soundVol);
        } else if (soundType === 'marimba') {
          synthesizeMarimba(soundVol);
        } else {
          // Default: Brass Kitchen Bell
          synthesizeBell(type, soundVol);
        }
      };

      // Compatibility alias
      window.playLoudKitchenBell = window.playAlertSound;

      // Synthesized Brass Service Bell
      function synthesizeBell(type, vol = 1.0) {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        let strikes = [];

        if (type === 'waiter') {
          strikes = [
            { freq: 1174.66, time: 0.0, gain: vol, decay: 1.0 },
            { freq: 1174.66, time: 0.18, gain: vol, decay: 1.0 },
            { freq: 1396.91, time: 0.38, gain: vol, decay: 1.6 }
          ];
        } else if (type === 'bill') {
          strikes = [
            { freq: 1318.51, time: 0.0, gain: vol, decay: 1.1 },
            { freq: 987.77, time: 0.25, gain: vol, decay: 1.5 }
          ];
        } else if (type === 'ready') {
          strikes = [
            { freq: 1318.51, time: 0.0, gain: vol, decay: 1.0 },
            { freq: 1567.98, time: 0.15, gain: vol, decay: 1.0 },
            { freq: 2093.00, time: 0.35, gain: vol, decay: 1.8 }
          ];
        } else {
          strikes = [
            { freq: 1046.50, time: 0.0, gain: vol, decay: 1.2 },
            { freq: 1318.51, time: 0.24, gain: vol, decay: 1.6 }
          ];
        }

        strikes.forEach(s => {
          const t = now + s.time;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(s.freq, t);
          gain1.gain.setValueAtTime(0.0001, t);
          gain1.gain.linearRampToValueAtTime(s.gain * 0.75, t + 0.003);
          gain1.gain.exponentialRampToValueAtTime(0.0001, t + s.decay);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(t);
          osc1.stop(t + s.decay + 0.05);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(s.freq * 2.76, t);
          gain2.gain.setValueAtTime(0.0001, t);
          gain2.gain.linearRampToValueAtTime(s.gain * 0.4, t + 0.002);
          gain2.gain.exponentialRampToValueAtTime(0.0001, t + (s.decay * 0.5));
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(t);
          osc2.stop(t + (s.decay * 0.5) + 0.05);

          const osc3 = ctx.createOscillator();
          const gain3 = ctx.createGain();
          osc3.type = 'triangle';
          osc3.frequency.setValueAtTime(s.freq * 4.15, t);
          gain3.gain.setValueAtTime(0.0001, t);
          gain3.gain.linearRampToValueAtTime(s.gain * 0.3, t + 0.001);
          gain3.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
          osc3.connect(gain3);
          gain3.connect(ctx.destination);
          osc3.start(t);
          osc3.stop(t + 0.15);
        });
      }

      function synthesizeChime(vol = 1.0) {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        [
          { f: 1318.51, t: 0, d: 0.9 },
          { f: 987.77, t: 0.28, d: 1.4 }
        ].forEach(n => {
          const t = now + n.t;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(n.f, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(vol * 0.65, t + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + n.d);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + n.d + 0.05);
        });
      }

      function synthesizeBeep(vol = 1.0) {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        [880, 1320].forEach((freq, idx) => {
          const t = now + idx * 0.12;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(vol * 0.55, t + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        });
      }

      function synthesizeMarimba(vol = 1.0) {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const t = now + idx * 0.09;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(vol * 0.5, t + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.5);
        });
      }

      // Automatically unlock audio context on any user interaction anywhere on the page
      ['click', 'touchstart', 'keydown'].forEach(evt => {
        window.addEventListener(evt, () => {
          getAudioContext();
        }, { once: false, passive: true });
      });

      // Format time helper
      function formatTimeAgo(iso) {
        try {
          const diffSec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
          if (diffSec < 60) return diffSec + 's ago';
          const min = Math.floor(diffSec / 60);
          return min + 'm ago';
        } catch {
          return 'just now';
        }
      }

      // Render Waiter & Bill Alerts Banner
      // Render Waiter & Bill Alerts Banner + Food Ready Alerts
      function renderTableAlerts(calls = [], readyOrders = []) {
        const host = document.getElementById('adminAlertsBannerHost');
        if (!host) return;

        if ((!calls || !calls.length) && (!readyOrders || !readyOrders.length)) {
          host.innerHTML = '';
          return;
        }

        const readyHtml = (readyOrders || []).map(r => `
          <div class="admin-table-alert type-ready" style="border-left: 6px solid #10b981; background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);">
            <div class="alert-content">
              <div class="alert-emoji">🍳</div>
              <div>
                <div class="alert-title">TABLE ${r.table_number}: FOOD COOKED & READY!</div>
                <div class="alert-sub">Order #${r.number} is prepared by kitchen! Ready to serve · ${formatTimeAgo(r.updated_at)}</div>
              </div>
            </div>
            <button type="button" class="alert-ack-btn" style="background: #10b981; color: #fff;" onclick="window.markOrderServed(${r.id})">
              🍽️ Mark Served
            </button>
          </div>
        `).join('');

        const callsHtml = (calls || []).map(c => {
          const isWaiter = c.type === 'waiter';
          return `
            <div class="admin-table-alert ${isWaiter ? 'type-waiter' : 'type-bill'}" data-call-id="${c.id}">
              <div class="alert-content">
                <div class="alert-emoji">${isWaiter ? '🔔' : '💳'}</div>
                <div>
                  <div class="alert-title">TABLE ${c.table_number}: ${isWaiter ? 'WAITER CALLED!' : 'BILL REQUESTED!'}</div>
                  <div class="alert-sub">${isWaiter ? 'Guest needs assistance at Table ' + c.table_number : 'Table ' + c.table_number + ' requested their bill'} · ${formatTimeAgo(c.created_at)}</div>
                </div>
              </div>
              <button type="button" class="alert-ack-btn" onclick="window.dismissWaiterCall(${c.id})">
                ✓ ${isWaiter ? 'Attended' : 'Done'} (Dismiss)
              </button>
            </div>
          `;
        }).join('');

        host.innerHTML = readyHtml + callsHtml;
      }

      // Mark Order Served directly from Food Ready alert
      window.markOrderServed = async function (id) {
        try {
          await fetch('/api/admin/orders/' + id + '/status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 'served' })
          });
          pollAlertsImmediately();
        } catch (e) {
          console.error('Error marking order served:', e);
        }
      };

      // Dismiss Waiter Call
      window.dismissWaiterCall = async function (id) {
        try {
          await fetch('/api/admin/waiter-calls/' + id + '/seen', { method: 'POST' });
          await fetch('/api/admin/orders/call-' + id + '/seen', { method: 'POST' }).catch(() => {});
          pollAlertsImmediately();
        } catch (e) {
          console.error('Error dismissing waiter call:', e);
        }
      };

      // Poll Alerts
      let knownReadyIds = new Set();
      async function pollAlertsImmediately() {
        try {
          const res = await fetch('/api/admin/waiter-calls');
          if (res.ok) {
            const data = await res.json();
            const calls = data.calls || [];
            const readyOrders = data.readyOrders || [];

            let hasNewAlert = false;
            let newestType = 'order';

            // Check waiter calls
            calls.forEach(c => {
              if (!knownCallIds.has(c.id)) {
                knownCallIds.add(c.id);
                hasNewAlert = true;
                newestType = c.type || 'waiter';
              }
            });

            // Check ready orders from kitchen
            readyOrders.forEach(r => {
              if (!knownReadyIds.has(r.id)) {
                knownReadyIds.add(r.id);
                hasNewAlert = true;
                newestType = 'ready';
              }
            });

            if (hasNewAlert) {
              window.playAlertSound(newestType);
            } else if ((calls.length > 0 || readyOrders.length > 0) && Date.now() - lastReminderTime > 15000) {
              lastReminderTime = Date.now();
              window.playAlertSound(readyOrders.length ? 'ready' : (calls[0].type || 'waiter'));
            }

            renderTableAlerts(calls, readyOrders);
          }
        } catch {}
      }

      // Background Pulse Monitor (checks pulse every 1.5 seconds)
      async function checkPulse() {
        try {
          const res = await fetch('/api/admin/pulse');
          if (res.ok) {
            const data = await res.json();
            if (lastPulseRev === null) {
              lastPulseRev = data.rev;
              pollAlertsImmediately();
            } else if (data.rev !== lastPulseRev) {
              lastPulseRev = data.rev;
              pollAlertsImmediately();
            }
          }
        } catch {}
      }

      
      // SOUND SETTINGS MODAL (Browse laptop for sound or pick preset chimes)
      window.openSoundSettingsModal = function () {
        const existing = document.getElementById('soundSettingsModalOverlay');
        if (existing) existing.remove();

        const curType = localStorage.getItem('muse_sound_type') || 'bell';
        const curName = localStorage.getItem('muse_sound_name') || 'Kitchen Brass Bell (Default)';
        const curVol = localStorage.getItem('muse_sound_volume') || '1.0';
        const customFileName = localStorage.getItem('muse_custom_sound_name') || '';

        const overlay = document.createElement('div');
        overlay.id = 'soundSettingsModalOverlay';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,15,10,0.65);backdrop-filter:blur(6px);z-index:999999;display:flex;align-items:center;justify-content:center;padding:16px;';

        overlay.innerHTML = `
          <div style="background:#ffffff;border-radius:22px;max-width:460px;width:100%;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,0.35);font-family:system-ui,-apple-system,sans-serif;color:#2b1f16;position:relative;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
              <h2 style="font-size:1.3rem;font-weight:700;margin:0;display:flex;align-items:center;gap:8px;">
                <span>🔔</span> Notification Sound
              </h2>
              <button type="button" onclick="document.getElementById('soundSettingsModalOverlay').remove()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#78716c;padding:4px;">✕</button>
            </div>

            <p style="font-size:0.88rem;color:#78716c;margin:0 0 16px;">
              Select the chime for incoming orders, food-ready alerts, and waiter calls, or select a custom audio file directly from your laptop.
            </p>

            <div style="background:#fdfbf7;border:1.5px solid #ebd9c8;border-radius:12px;padding:12px 14px;margin-bottom:18px;">
              <div style="font-size:0.8rem;text-transform:uppercase;color:#8d5b4c;font-weight:700;letter-spacing:0.04em;">Current Active Sound:</div>
              <div id="modalActiveSoundLabel" style="font-weight:700;font-size:1.05rem;color:#3b2a21;margin-top:2px;">${curName}</div>
              ${customFileName ? `<div style="font-size:0.8rem;color:#78716c;margin-top:4px;">Device File: <code>${customFileName}</code></div>` : ''}
            </div>

            <!-- BROWSE AUDIO FILE BUTTON -->
            <div style="margin-bottom:20px;">
              <input type="file" id="modalAudioFileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac" style="display:none;" />
              <button type="button" id="modalBrowseAudioBtn" style="width:100%;background:linear-gradient(135deg, #3b2a21 0%, #1f140e 100%);color:#fff;border:none;border-radius:14px;padding:14px 18px;font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 14px rgba(59,42,33,0.3);transition:transform 0.15s ease;">
                <span>📁</span> Browse Laptop for Custom Sound (.mp3, .wav, .ogg)
              </button>
              <div id="modalUploadStatus" style="font-size:0.82rem;color:#16a34a;margin-top:6px;min-height:16px;text-align:center;font-weight:600;"></div>
            </div>

            <!-- PRESET CHIMES -->
            <div style="margin-bottom:18px;">
              <label style="font-size:0.85rem;font-weight:700;color:#57534e;display:block;margin-bottom:8px;">Or Choose Preset Chime:</label>
              <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
                <button type="button" class="modal-sound-preset-btn" data-type="bell" data-name="Kitchen Brass Bell (Default)" style="padding:10px;border:1.5px solid ${curType==='bell'?'#3b2a21':'#e7e5e4'};background:${curType==='bell'?'#fbf7f2':'#fdfbf7'};border-radius:10px;font-weight:600;font-size:0.88rem;cursor:pointer;text-align:left;color:#2b1f16;">
                  🔔 Kitchen Bell
                </button>
                <button type="button" class="modal-sound-preset-btn" data-type="chime" data-name="Double Chime (Ding-Dong)" style="padding:10px;border:1.5px solid ${curType==='chime'?'#3b2a21':'#e7e5e4'};background:${curType==='chime'?'#fbf7f2':'#fdfbf7'};border-radius:10px;font-weight:600;font-size:0.88rem;cursor:pointer;text-align:left;color:#2b1f16;">
                  🎵 Double Chime
                </button>
                <button type="button" class="modal-sound-preset-btn" data-type="beep" data-name="Digital Alert Beep" style="padding:10px;border:1.5px solid ${curType==='beep'?'#3b2a21':'#e7e5e4'};background:${curType==='beep'?'#fbf7f2':'#fdfbf7'};border-radius:10px;font-weight:600;font-size:0.88rem;cursor:pointer;text-align:left;color:#2b1f16;">
                  ⚡ Digital Beep
                </button>
                <button type="button" class="modal-sound-preset-btn" data-type="marimba" data-name="Warm Marimba Chime" style="padding:10px;border:1.5px solid ${curType==='marimba'?'#3b2a21':'#e7e5e4'};background:${curType==='marimba'?'#fbf7f2':'#fdfbf7'};border-radius:10px;font-weight:600;font-size:0.88rem;cursor:pointer;text-align:left;color:#2b1f16;">
                  🎶 Warm Marimba
                </button>
              </div>
            </div>

            <!-- TEST & VOLUME -->
            <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#f5f5f4;border-radius:12px;margin-bottom:20px;">
              <button type="button" id="modalTestSoundBtn" style="background:#0f172a;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:0.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;">
                <span>▶</span> Test Sound
              </button>
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:0.82rem;font-weight:600;color:#57534e;">Volume:</span>
                <input type="range" id="modalSoundVol" min="0.1" max="1.0" step="0.1" value="${curVol}" style="width:90px;cursor:pointer;" />
              </div>
            </div>

            <div style="text-align:right;">
              <button type="button" onclick="document.getElementById('soundSettingsModalOverlay').remove()" style="background:#1c1917;color:#fff;border:none;border-radius:10px;padding:10px 22px;font-weight:700;font-size:0.92rem;cursor:pointer;">
                Done
              </button>
            </div>
          </div>
        `;

        document.body.appendChild(overlay);

        const fileInput = document.getElementById('modalAudioFileInput');
        const browseBtn = document.getElementById('modalBrowseAudioBtn');
        const uploadStatus = document.getElementById('modalUploadStatus');
        const labelEl = document.getElementById('modalActiveSoundLabel');
        const testBtn = document.getElementById('modalTestSoundBtn');
        const volSlider = document.getElementById('modalSoundVol');

        browseBtn.addEventListener('click', () => {
          fileInput.value = '';
          fileInput.click();
        });

        fileInput.addEventListener('change', async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;

          uploadStatus.style.color = '#0284c7';
          uploadStatus.textContent = 'Loading ' + file.name + '...';

          const reader = new FileReader();
          reader.onload = async (ev) => {
            const dataUrl = ev.target.result;
            const soundName = 'Custom: ' + file.name;
            localStorage.setItem('muse_sound_type', 'custom');
            localStorage.setItem('muse_custom_sound', dataUrl);
            localStorage.setItem('muse_custom_sound_name', file.name);
            localStorage.setItem('muse_sound_name', soundName);

            labelEl.textContent = soundName;
            uploadStatus.style.color = '#16a34a';
            uploadStatus.textContent = '✅ Sound uploaded: ' + file.name;

            // Update server
            try {
              await fetch('/api/admin/sound', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  sound_type: 'custom',
                  sound_name: soundName,
                  sound_data: dataUrl,
                  sound_volume: parseFloat(volSlider.value || '1.0')
                })
              });
            } catch {}

            window.playAlertSound('order');
          };
          reader.readAsDataURL(file);
        });

        // Preset button handlers
        document.querySelectorAll('.modal-sound-preset-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const type = btn.getAttribute('data-type');
            const name = btn.getAttribute('data-name');
            localStorage.setItem('muse_sound_type', type);
            localStorage.setItem('muse_sound_name', name);
            labelEl.textContent = name;
            uploadStatus.textContent = '';

            document.querySelectorAll('.modal-sound-preset-btn').forEach(b => {
              b.style.borderColor = '#e7e5e4';
              b.style.background = '#fdfbf7';
            });
            btn.style.borderColor = '#3b2a21';
            btn.style.background = '#fbf7f2';

            try {
              await fetch('/api/admin/sound', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  sound_type: type,
                  sound_name: name,
                  sound_volume: parseFloat(volSlider.value || '1.0')
                })
              });
            } catch {}

            window.playAlertSound('order');
          });
        });

        testBtn.addEventListener('click', () => {
          window.playAlertSound('order');
        });

        volSlider.addEventListener('input', async (e) => {
          const v = String(e.target.value);
          localStorage.setItem('muse_sound_volume', v);
          try {
            await fetch('/api/admin/sound', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sound_volume: parseFloat(v) })
            });
          } catch {}
        });
      };

      // MANAGER AUTHORIZATION ENGINE (4-DIGIT PIN OR BIOMETRICS)
      window.askManagerAuth = function (actionTitle = 'Perform Protected Action') {
        return new Promise((resolve) => {
          const existing = document.getElementById('managerAuthModalOverlay');
          if (existing) existing.remove();

          const hasBio = typeof window !== 'undefined' && window.PublicKeyCredential;

          const overlay = document.createElement('div');
          overlay.id = 'managerAuthModalOverlay';
          overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,15,10,0.65);backdrop-filter:blur(6px);z-index:999999;display:flex;align-items:center;justify-content:center;padding:16px;';

          overlay.innerHTML = `
            <div style="background:#ffffff;border-radius:20px;max-width:380px;width:100%;padding:24px 20px;box-shadow:0 24px 48px rgba(0,0,0,0.3);text-align:center;font-family:system-ui,-apple-system,sans-serif;color:#2b1f16;position:relative;">
              <div style="width:52px;height:52px;background:#fef3c7;border:2px solid #f59e0b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px;">🔒</div>
              <h2 style="font-size:1.25rem;font-weight:700;margin:0 0 6px;color:#1c1917;">Manager Authorization</h2>
              <p style="font-size:0.88rem;color:#78716c;margin:0 0 16px;">Action: <strong style="color:#b91c1c;">${actionTitle}</strong></p>

              ${hasBio ? `
                <button type="button" id="authBioBtn" style="width:100%;background:#166534;color:#fff;border:none;border-radius:12px;padding:12px;font-size:0.95rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-bottom:14px;box-shadow:0 2px 8px rgba(22,101,52,0.3);">
                  <span>👆</span> Verify with Fingerprint / Face ID
                </button>
                <div style="font-size:0.78rem;color:#a8a29e;margin-bottom:12px;">— OR ENTER 4-DIGIT PIN —</div>
              ` : ''}

              <div style="margin-bottom:14px;">
                <input type="password" id="authPinInput" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="••••" autocomplete="off" style="width:140px;height:46px;text-align:center;font-size:1.6rem;letter-spacing:10px;border:2px solid #d6d3d1;border-radius:12px;outline:none;background:#fafaf9;color:#292524;" />
                <div id="authErrMsg" style="font-size:0.82rem;color:#dc2626;min-height:18px;margin-top:6px;font-weight:600;"></div>
              </div>

              <!-- Quick Number Pad for Touch/Tablet -->
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto 16px;">
                ${[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k => `
                  <button type="button" class="auth-key-btn" data-key="${k}" style="height:40px;border:1px solid #e7e5e4;background:#f5f5f4;border-radius:8px;font-size:1.1rem;font-weight:600;cursor:pointer;color:#292524;">${k}</button>
                `).join('')}
              </div>

              <div style="display:flex;gap:10px;justify-content:center;">
                <button type="button" id="authCancelBtn" style="flex:1;background:#f5f5f4;border:1px solid #d6d3d1;border-radius:10px;padding:10px;font-size:0.9rem;font-weight:600;cursor:pointer;color:#57534e;">Cancel</button>
                <button type="button" id="authConfirmBtn" style="flex:1;background:#b91c1c;border:none;border-radius:10px;padding:10px;font-size:0.9rem;font-weight:600;cursor:pointer;color:#ffffff;">Authorize</button>
              </div>
            </div>
          `;

          document.body.appendChild(overlay);

          const pinInput = document.getElementById('authPinInput');
          const errMsg = document.getElementById('authErrMsg');
          const cancelBtn = document.getElementById('authCancelBtn');
          const confirmBtn = document.getElementById('authConfirmBtn');
          const bioBtn = document.getElementById('authBioBtn');

          if (pinInput) pinInput.focus();

          const cleanup = (result) => {
            overlay.remove();
            resolve(result);
          };

          cancelBtn.addEventListener('click', () => cleanup(false));
          overlay.addEventListener('click', (e) => {
            if (e.target === overlay) cleanup(false);
          });

          // Keypad Handler
          overlay.querySelectorAll('.auth-key-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const k = btn.dataset.key;
              if (k === 'C') {
                pinInput.value = '';
              } else if (k === '⌫') {
                pinInput.value = pinInput.value.slice(0, -1);
              } else if (pinInput.value.length < 4) {
                pinInput.value += k;
              }
              errMsg.textContent = '';
              if (pinInput.value.length === 4) {
                verifyPin();
              }
            });
          });

          pinInput.addEventListener('input', () => {
            errMsg.textContent = '';
            if (pinInput.value.length === 4) {
              verifyPin();
            }
          });

          pinInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') verifyPin();
            if (e.key === 'Escape') cleanup(false);
          });

          confirmBtn.addEventListener('click', () => verifyPin());

          // Verify PIN with server
          async function verifyPin() {
            const val = pinInput.value.trim();
            if (val.length < 4) {
              errMsg.textContent = 'Please enter all 4 digits.';
              return;
            }
            try {
              confirmBtn.disabled = true;
              confirmBtn.textContent = 'Verifying…';
              const res = await fetch('/api/admin/verify-pin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin: val })
              });
              if (res.ok) {
                cleanup(true);
              } else {
                const errData = await res.json().catch(() => ({}));
                errMsg.textContent = errData.error || '❌ Incorrect PIN';
                pinInput.value = '';
                pinInput.focus();
                confirmBtn.disabled = false;
                confirmBtn.textContent = 'Authorize';
              }
            } catch (err) {
              errMsg.textContent = 'Network error. Try again.';
              confirmBtn.disabled = false;
              confirmBtn.textContent = 'Authorize';
            }
          }

          // Biometric Verification Handler (Self-Healing & Multi-Device)
          if (bioBtn) {
            bioBtn.addEventListener('click', async () => {
              if (!window.isSecureContext) {
                errMsg.textContent = 'ℹ️ Biometrics requires HTTPS. Use the cloud link or enter 4-digit PIN.';
                pinInput.focus();
                return;
              }
              try {
                bioBtn.disabled = true;
                errMsg.textContent = '';
                const chall = new Uint8Array(32);
                window.crypto.getRandomValues(chall);

                let credId = localStorage.getItem('muse_biometric_id');

                // If not in localStorage, check if server has authorized credentials
                let serverCreds = [];
                if (!credId) {
                  try {
                    const stRes = await fetch('/api/auth/state');
                    if (stRes.ok) {
                      const st = await stRes.json();
                      serverCreds = st.credentials || [];
                    }
                  } catch {}
                }

                // If a credential exists either locally or on the server, attempt verification
                if (credId || serverCreds.length > 0) {
                  bioBtn.textContent = 'Touch sensor…';
                  const opt = {
                    publicKey: {
                      challenge: chall,
                      userVerification: 'preferred',
                      timeout: 60000
                    }
                  };
                  const allowList = [];
                  if (credId) {
                    try {
                      const bin = atob(credId.replace(/-/g, '+').replace(/_/g, '/'));
                      const arr = new Uint8Array(bin.length);
                      for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
                      allowList.push({ type: 'public-key', id: arr });
                    } catch {}
                  }
                  serverCreds.forEach(c => {
                    try {
                      const bin = atob(c.replace(/-/g, '+').replace(/_/g, '/'));
                      const arr = new Uint8Array(bin.length);
                      for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
                      allowList.push({ type: 'public-key', id: arr });
                    } catch {}
                  });

                  if (allowList.length > 0) {
                    opt.publicKey.allowCredentials = allowList;
                  }

                  try {
                    const assertion = await navigator.credentials.get(opt);
                    if (assertion) {
                      const rawId = btoa(String.fromCharCode(...new Uint8Array(assertion.rawId)));
                      localStorage.setItem('muse_biometric_id', rawId);
                      cleanup(true);
                      return;
                    }
                  } catch (getErr) {
                    if (getErr.name === 'NotAllowedError') {
                      errMsg.textContent = 'Scan canceled. Enter 4-digit PIN.';
                      return;
                    }
                    console.warn('Get failed, trying registration fallback:', getErr);
                  }
                }

                // If not registered yet on this device, register on fingerprint touch!
                bioBtn.textContent = 'Touch sensor to register this device…';
                const uId = new Uint8Array(16);
                window.crypto.getRandomValues(uId);
                const newCred = await navigator.credentials.create({
                  publicKey: {
                    challenge: chall,
                    rp: { name: 'Muse Management' },
                    user: { id: uId, name: 'admin', displayName: 'Manager' },
                    pubKeyCredParams: [
                      { type: 'public-key', alg: -7 },
                      { type: 'public-key', alg: -257 },
                      { type: 'public-key', alg: -8 }
                    ],
                    authenticatorSelection: {
                      authenticatorAttachment: 'platform',
                      userVerification: 'preferred'
                    },
                    timeout: 60000
                  }
                });

                if (newCred) {
                  const rawId = btoa(String.fromCharCode(...new Uint8Array(newCred.rawId)));
                  localStorage.setItem('muse_biometric_id', rawId);
                  await fetch('/api/auth/webauthn/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential_id: rawId, credential_name: navigator.userAgent.slice(0, 30) })
                  }).catch(() => {});
                  cleanup(true);
                  return;
                }
              } catch (err) {
                errMsg.textContent = err.name === 'NotAllowedError' ? 'Scan canceled. Enter 4-digit PIN.' : 'Biometrics: ' + err.message;
              } finally {
                bioBtn.disabled = false;
                bioBtn.innerHTML = '<span>👆</span> Verify with Fingerprint / Face ID';
              }
            });
          }
        });
      };

      // Universal Biometric Login Enhancer for Sign-in Page
      async function enhanceLoginScreen() {
        if (!window.isSecureContext || !window.PublicKeyCredential) return;

        const form = document.querySelector('form.signin');
        if (!form) return;

        let existingBtn = form.querySelector('button[type="button"].btn');
        if (!existingBtn) {
          try {
            const stRes = await fetch('/api/auth/state');
            const st = await stRes.json();

            if (!document.getElementById('enhancedBioLoginBtn')) {
              const bioContainer = document.createElement('div');
              bioContainer.id = 'enhancedBioLoginContainer';
              bioContainer.style.cssText = 'margin:12px 0 16px;width:100%;';
              bioContainer.innerHTML = `
                <button type="button" id="enhancedBioLoginBtn" style="width:100%;background:#166534;color:#fff;border:none;border-radius:12px;padding:13px;font-size:0.95rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 4px 12px rgba(22,101,52,0.3);transition:transform 0.15s;">
                  <span>👆</span> Sign in with Fingerprint / Face ID
                </button>
                <div style="text-align:center;margin:10px 0 4px;font-size:0.8rem;color:#888;">— or enter user ID & password —</div>
              `;
              const heading = form.querySelector('p.muted') || form.querySelector('h1');
              if (heading && heading.parentNode) {
                heading.parentNode.insertBefore(bioContainer, heading.nextSibling);
              }

              document.getElementById('enhancedBioLoginBtn').addEventListener('click', async () => {
                const btn = document.getElementById('enhancedBioLoginBtn');
                btn.disabled = true;
                btn.innerHTML = '<span>🔄</span> Scanning Fingerprint / Face ID…';
                try {
                  const chall = new Uint8Array(32);
                  window.crypto.getRandomValues(chall);

                  const credId = localStorage.getItem('muse_biometric_id');
                  const allowList = [];
                  if (credId) {
                    try {
                      const bin = atob(credId.replace(/-/g, '+').replace(/_/g, '/'));
                      const arr = new Uint8Array(bin.length);
                      for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
                      allowList.push({ type: 'public-key', id: arr });
                    } catch {}
                  }
                  (st.credentials || []).forEach(c => {
                    try {
                      const bin = atob(c.replace(/-/g, '+').replace(/_/g, '/'));
                      const arr = new Uint8Array(bin.length);
                      for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
                      allowList.push({ type: 'public-key', id: arr });
                    } catch {}
                  });

                  if (allowList.length > 0) {
                    const opt = {
                      publicKey: {
                        challenge: chall,
                        allowCredentials: allowList,
                        userVerification: 'preferred',
                        timeout: 60000
                      }
                    };
                    const assertion = await navigator.credentials.get(opt);
                    if (assertion) {
                      const rawId = btoa(String.fromCharCode(...new Uint8Array(assertion.rawId)));
                      localStorage.setItem('muse_biometric_id', rawId);
                      const loginRes = await fetch('/api/auth/webauthn/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ credential_id: rawId })
                      });
                      if (loginRes.ok) {
                        window.location.reload();
                        return;
                      }
                    }
                  }

                  // Quick register on this device with PIN
                  const pin = prompt('First time using Fingerprint / Face ID on this device.\nEnter Manager PIN (default: 1234) to link this device:');
                  if (!pin) {
                    btn.disabled = false;
                    btn.innerHTML = '<span>👆</span> Sign in with Fingerprint / Face ID';
                    return;
                  }

                  btn.innerHTML = '<span>👆</span> Touch sensor to register…';
                  const uId = new Uint8Array(16);
                  window.crypto.getRandomValues(uId);
                  const newCred = await navigator.credentials.create({
                    publicKey: {
                      challenge: chall,
                      rp: { name: 'Muse Management' },
                      user: { id: uId, name: 'admin', displayName: 'Manager' },
                      pubKeyCredParams: [
                        { type: 'public-key', alg: -7 },
                        { type: 'public-key', alg: -257 },
                        { type: 'public-key', alg: -8 }
                      ],
                      authenticatorSelection: {
                        authenticatorAttachment: 'platform',
                        userVerification: 'preferred'
                      },
                      timeout: 60000
                    }
                  });

                  if (newCred) {
                    const rawId = btoa(String.fromCharCode(...new Uint8Array(newCred.rawId)));
                    localStorage.setItem('muse_biometric_id', rawId);
                    const qRes = await fetch('/api/auth/webauthn/quick-register', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                        credential_id: rawId,
                        credential_name: navigator.userAgent.slice(0, 30),
                        pin: pin.trim()
                      })
                    });
                    if (qRes.ok) {
                      window.location.reload();
                      return;
                    } else {
                      const qErr = await qRes.json().catch(() => ({}));
                      alert(qErr.error || 'Failed to register biometrics with entered PIN.');
                    }
                  }
                } catch (e) {
                  if (e.name !== 'NotAllowedError') {
                    alert('Biometric sign-in note: ' + e.message);
                  }
                } finally {
                  btn.disabled = false;
                  btn.innerHTML = '<span>👆</span> Sign in with Fingerprint / Face ID';
                }
              });
            }
          } catch {}
        }
      }

      setInterval(enhanceLoginScreen, 800);

      // Start polling
      setInterval(checkPulse, 1500);
      setInterval(pollAlertsImmediately, 4000);
    })();
  </script>
</body>
</html>
